version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_password
      POSTGRES_DB: lifeos_db
    ports:
      - "5432:5432"
    volumes:
      - lifeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lifeos_postgres_data:
